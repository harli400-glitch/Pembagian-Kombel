            font-weight: 600;
        }

        }

        }

        }

        }

        }

<body class="text-gray-800 antialiased min-h-screen flex flex-col">

    </header>

    <main class="flex-grow max-w-5xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8">
        
        <div class="bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden">
            <div class="flex border-b border-gray-200">
                <button onclick="switchTab('searchSchool')" id="tab-searchSchool" class="flex-1 py-4 px-6 text-center text-sm md:text-base font-medium text-gray-500 hover:text-primary-600 transition-colors tab-active focus:outline-none">

                    <i class="fas fa-filter mr-2"></i>Filter Jenis Kombel
                </button>
            </div>

            <div id="view-searchSchool" class="p-6 md:p-8">
                <div class="mb-6">
                    <label for="schoolInput" class="block text-sm font-semibold text-gray-700 mb-2">Masukkan Nama Sekolah</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-school text-gray-400"></i>
                        </div>
                        <input type="text" id="schoolInput" class="block w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl leading-5 bg-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all sm:text-sm" placeholder="Contoh: TK ABADI GAMSUNGI atau SD INPRES...">
                        <button onclick="searchBySchool()" class="absolute inset-y-1 right-1 px-4 bg-primary-600 hover:bg-primary-700 text-white text-sm font-medium rounded-lg transition-colors">
                            Cari
                        </button>
                    </div>
                    <p class="mt-2 text-xs text-gray-500"><i class="fas fa-info-circle mr-1"></i>Ketik nama sekolah lalu klik Cari atau tekan Enter.</p>
                </div>
                
                <div id="schoolSearchResult" class="hidden mt-6">
                    <!-- Results will be injected here -->
                </div>
            </div>

            <div id="view-searchKombel" class="p-6 md:p-8 hidden">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                    <div>
                        <label for="jenisKombelSelect" class="block text-sm font-semibold text-gray-700 mb-2">Pilih Jenis Kombel</label>
                        <div class="relative">
                            <select id="jenisKombelSelect" onchange="updateKombelDropdown()" class="block w-full pl-4 pr-10 py-3 text-base border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 rounded-xl transition-all appearance-none bg-white">
                                <option value="" disabled selected>-- Pilih Jenis Kombel --</option>
                                <!-- Options populated by JS -->
                            </select>
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
                                <i class="fas fa-chevron-down text-sm"></i>
                            </div>
                        </div>
                    </div>
                    <div>
                        <label for="namaKombelSelect" class="block text-sm font-semibold text-gray-700 mb-2">Pilih Nama Kombel</label>
                        <div class="relative">
                            <select id="namaKombelSelect" onchange="showKombelDetails()" class="block w-full pl-4 pr-10 py-3 text-base border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 rounded-xl transition-all appearance-none bg-gray-50" disabled>
                                <option value="" disabled selected>-- Pilih Jenis Kombel Dahulu --</option>
                            </select>
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
                                <i class="fas fa-chevron-down text-sm"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="kombelFilterResult" class="hidden mt-6">
                    <!-- Results will be injected here -->
                </div>
            </div>
        </div>
    </main>

        document.addEventListener('DOMContentLoaded', () => {
            // Populate Jenis Kombel dropdown on load
            const jenisKombelSelect = document.getElementById('jenisKombelSelect');
            Object.keys(kombelData).forEach(jenis => {
                const option = document.createElement('option');
                option.value = jenis;
                option.textContent = jenis;
                jenisKombelSelect.appendChild(option);

        // Tab Switching Logic
        function switchTab(tabId) {
            // Reset tabs
            document.getElementById('tab-searchSchool').classList.remove('tab-active');
            document.getElementById('tab-searchSchool').classList.add('text-gray-500');
            document.getElementById('tab-searchKombel').classList.remove('tab-active');
            document.getElementById('tab-searchKombel').classList.add('text-gray-500');
            
            document.getElementById('view-searchSchool').classList.add('hidden');
            document.getElementById('view-searchKombel').classList.add('hidden');

            // Activate chosen tab
            document.getElementById(`tab-${tabId}`).classList.add('tab-active');
            document.getElementById(`tab-${tabId}`).classList.remove('text-gray-500');
            
            const view = document.getElementById(`view-${tabId}`);
            view.classList.remove('hidden');
            view.classList.add('fade-in');
        }

        // Search logic for School -> Kombel
        function searchBySchool() {
            const input = document.getElementById('schoolInput').value.trim().toLowerCase();
            const resultDiv = document.getElementById('schoolSearchResult');
            
            if (!input) {
                resultDiv.innerHTML = `<div class="p-4 bg-yellow-50 text-yellow-700 border border-yellow-200 rounded-xl"><i class="fas fa-exclamation-triangle mr-2"></i>Silakan masukkan nama sekolah terlebih dahulu.</div>`;
                resultDiv.classList.remove('hidden');
                return;
            }

            let foundKombels = [];

            // Iterate through all data to find matching schools
            for (const [jenisKombel, kombels] of Object.entries(kombelData)) {
                for (const [namaKombel, sekolahList] of Object.entries(kombels)) {
                    const matches = sekolahList.filter(sekolah => sekolah.toLowerCase().includes(input));
                    if (matches.length > 0) {
                        foundKombels.push({
                            jenis: jenisKombel,
                            nama: namaKombel,
                            semuaSekolah: sekolahList,
                            sekolahDitemukan: matches
                        });
                    }
                }
            }

            // Render Results
            if (foundKombels.length === 0) {
                resultDiv.innerHTML = `<div class="p-4 bg-red-50 text-red-700 border border-red-200 rounded-xl"><i class="fas fa-times-circle mr-2"></i>Sekolah dengan nama "<b>${document.getElementById('schoolInput').value}</b>" tidak ditemukan.</div>`;
            } else {
                let html = `<p class="mb-4 text-sm text-gray-600 font-medium">Ditemukan dalam ${foundKombels.length} Kombel:</p>`;
                
                foundKombels.forEach(kombel => {
                    html += `
                        <div class="mb-6 bg-white border border-primary-200 rounded-xl overflow-hidden shadow-sm fade-in">
                            <div class="bg-primary-50 px-5 py-4 border-b border-primary-100 flex items-center justify-between">
                                <div>
                                    <span class="text-xs font-bold text-primary-600 uppercase tracking-wider">${kombel.jenis}</span>
                                    <h3 class="text-lg font-bold text-gray-900 mt-1">${kombel.nama}</h3>
                                </div>
                                <div class="bg-white p-2 rounded-full shadow-sm">
                                    <i class="fas fa-users text-primary-500"></i>
                                </div>
                            </div>
                            <div class="p-5">
                                <h4 class="text-sm font-semibold text-gray-700 mb-3 border-b pb-2"><i class="fas fa-list-ul mr-2 text-gray-400"></i>Daftar Sekolah dalam Kombel ini:</h4>
                                <ul class="grid grid-cols-1 md:grid-cols-2 gap-x-4 gap-y-2">
                    `;
                    
                    kombel.semuaSekolah.forEach(sekolah => {
                        const isMatch = kombel.sekolahDitemukan.includes(sekolah);
                        html += `
                            <li class="flex items-start text-sm ${isMatch ? 'text-primary-700 font-semibold bg-primary-50 p-1 rounded' : 'text-gray-600'}">
                                <i class="fas ${isMatch ? 'fa-check-circle text-primary-500 mt-0.5' : 'fa-circle text-[8px] text-gray-300 mt-1.5'} mr-2 min-w-[16px]"></i>
                                ${sekolah}
                            </li>
                        `;
                    });

                    html += `
                                </ul>
                            </div>
                        </div>
                    `;
                });
                resultDiv.innerHTML = html;
            }
            resultDiv.classList.remove('hidden');
            resultDiv.classList.add('fade-in');
        }

        // Dropdown logic for Kombel -> School
        function updateKombelDropdown() {
            const jenisSelect = document.getElementById('jenisKombelSelect');
            const namaSelect = document.getElementById('namaKombelSelect');
            const resultDiv = document.getElementById('kombelFilterResult');
            
            const selectedJenis = jenisSelect.value;
            resultDiv.classList.add('hidden'); // hide prev results

            // Clear options
            namaSelect.innerHTML = '<option value="" disabled selected>-- Pilih Nama Kombel --</option>';
            
            if (selectedJenis && kombelData[selectedJenis]) {
                const kombelNames = Object.keys(kombelData[selectedJenis]);
                kombelNames.forEach(nama => {
                    const option = document.createElement('option');
                    option.value = nama;
                    option.textContent = nama;
                    namaSelect.appendChild(option);
                });
                namaSelect.disabled = false;
                namaSelect.classList.remove('bg-gray-50');
                namaSelect.classList.add('bg-white');
            } else {
                namaSelect.disabled = true;
                namaSelect.classList.add('bg-gray-50');
                namaSelect.classList.remove('bg-white');
            }
        }

        function showKombelDetails() {
            const jenis = document.getElementById('jenisKombelSelect').value;
            const nama = document.getElementById('namaKombelSelect').value;
            const resultDiv = document.getElementById('kombelFilterResult');

            if (jenis && nama && kombelData[jenis][nama]) {
                const sekolahList = kombelData[jenis][nama];
                
                let html = `
                    <div class="bg-white border border-teal-200 rounded-xl overflow-hidden shadow-md fade-in">
                        <div class="bg-teal-50 px-5 py-4 border-b border-teal-100 flex items-center justify-between">
                            <div>
                                <span class="text-xs font-bold text-teal-600 uppercase tracking-wider">${jenis}</span>
                                <h3 class="text-xl font-bold text-gray-900 mt-1">${nama}</h3>
                            </div>
                            <div class="bg-white p-3 rounded-full shadow-sm text-teal-500">
                                <span class="font-bold text-lg">${sekolahList.length}</span> <span class="text-xs">Sekolah</span>
                            </div>
                        </div>
                        <div class="p-5">
                            <ul class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                `;

                sekolahList.forEach(sekolah => {
                    html += `
                        <li class="bg-gray-50 border border-gray-100 rounded-lg p-3 text-sm text-gray-700 font-medium hover:bg-teal-50 hover:border-teal-200 transition-colors flex items-center">
                            <i class="fas fa-building text-gray-400 mr-2 text-xs"></i> ${sekolah}
                        </li>
                    `;
                });

                html += `
                            </ul>
                        </div>
                    </div>
                `;
                
                resultDiv.innerHTML = html;
                resultDiv.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
